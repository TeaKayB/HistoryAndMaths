<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources Directory Test | HaMiEN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Clean layout wrappers for the dynamic tags */
    .filter-section { margin: 25px 0 15px 0; }
    .filter-label { font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    
    .tag-btn {
      background: #272d4215;
      color: var(--text-muted);
      border: 1px solid #272d4233;
      padding: 4px 10px;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
    }
    .tag-btn:hover { background: var(--accent-link); color: #fff; }
    .tag-btn.active-tag { background: var(--accent); color: #fff; }

    .res-card { background: #272d4211; border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 15px; }
    .res-type { display: inline-block; padding: 3px 8px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; background: #272d4222; border-radius: 4px; }
    .res-title a { color: var(--accent-link); text-decoration: underline; font-size: 1.25rem; }
    .res-desc { color: var(--text-muted); margin-top: 8px; }
    
    .footer-tags { margin-top: 50px; padding: 20px; background: #272d4205; border-top: 2px solid var(--border-color); border-radius: 6px; }
    .tag-link { color: var(--accent-link); text-decoration: none; cursor: pointer; }
    .tag-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h2>Network Resources Directory</h2>

    <!-- 1. Broad Category Buttons -->
    <div class="filter-section">
      <div class="filter-label">Category:</div>
      <div class="bulk-controls" style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="filter-btn active" id="btn-all" onclick="setCat('all')">All Resources</button>
        <button class="filter-btn" id="btn-blogs" onclick="setCat('blogs')">Blogs</button>
        <button class="filter-btn" id="btn-books" onclick="setCat('books')">Books</button>
        <button class="filter-btn" id="btn-papers" onclick="setCat('papers')">Papers</button>
        <button class="filter-btn" id="btn-societies" onclick="setCat('societies')">Societies</button>
        <button class="filter-btn" id="btn-websites" onclick="setCat('websites')">Websites</button>
      </div>
    </div>

    <!-- 2. Top 5 Popular Tag row -->
    <div class="filter-section">
      <div class="filter-label">Popular tags:</div>
      <div class="tag-row" id="pop-tags-container">Compiling...</div>
    </div>

    <!-- 3. Resource Card Grid Box -->
    <div id="cards-container">Loading dynamic directory assets...</div>

    <!-- 4. Global Footer Tag Box -->
    <section class="footer-tags">
      <div class="filter-label">All tags:</div>
      <div id="all-tags-container" style="line-height: 1.8;">Compiling tag index...</div>
    </section>
  </main>

  <!-- Connect Local Arrays Baseline Script Link -->
  <script src="resources-data.js"></script>
  <script>
    let activeCat = 'all', activeTag = 'all';
    const clean = s => s.trim().toLowerCase();

    function drawDirectory() {
      const box = document.getElementById('cards-container');
      if (!box || typeof HAMIEN_RESOURCES === 'undefined') return;

      const items = HAMIEN_RESOURCES.filter(entry => {
        const catMatch = activeCat === 'all' || entry.type.toLowerCase() === activeCat;
        const tagMatch = activeTag === 'all' || entry.tags.map(clean).includes(clean(activeTag));
        return catMatch && tagMatch;
      });

      if (!items.length) {
        box.innerHTML = `<p style="color: var(--text-muted);">No resources found matching this selection.</p>`;
        return;
      }

      box.innerHTML = items.map(entry => `
        <article class="res-card">
          <span class="res-type">${entry.type}</span>
          <h3 class="res-title"><a href="${entry.link}" target="_blank">${entry.title || 'Untitled'} ↗</a></h3>
          <p class="res-desc">${entry.description || ''}</p>
        </article>
      `).join('');
    }

    function drawTags() {
      if (typeof HAMIEN_RESOURCES === 'undefined') return;
      const index = {};
      
      HAMIEN_RESOURCES.forEach(entry => (entry.tags || []).forEach(t => {
        const name = clean(t);
        if (name) index[name] = (index[name] || 0) + 1;
      }));

      // Calculate Top 5
      const topFive = Object.keys(index).sort((a,b) => index[b] - index[a]).slice(0,5);
      const topBox = document.getElementById('pop-tags-container');
      if (topBox) topBox.innerHTML = topFive.map(t => `
        <button class="tag-btn ${activeTag === t ? 'active-tag' : ''}" onclick="toggleTag('${t}')">${t} (${index[t]})</button>
      `).join('');

      // Alphabetical Footer
      const alphaList = Object.keys(index).sort((a,b) => a.localeCompare(b));
      const footBox = document.getElementById('all-tags-container');
      if (footBox) footBox.innerHTML = alphaList.map((t, idx) => `
        <span class="tag-link" role="button" onclick="toggleTag('${t}')">${t}</span><span> (${index[t]})</span>${idx === alphaList.length - 1 ? '' : ', '}
      `).join('');
    }

    function setCat(catName) {
      activeCat = catName.toLowerCase();
      activeTag = 'all';
      document.querySelectorAll('.bulk-controls .filter-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${activeCat}`);
      if (activeBtn) activeBtn.add('active');
      drawTags(); drawDirectory();
    }

    function toggleTag(tagName) {
      activeTag = activeTag === tagName ? 'all' : tagName;
      drawTags(); drawDirectory();
    }

    // Force run immediately on load
    drawTags();
    drawDirectory();
  </script>
</body>
</html>
